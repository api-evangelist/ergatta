aid: ergatta
name: Ergatta
description: >-
  Ergatta is a connected-fitness company that makes game-based home rowing
  machines, pairing WaterRower-derived water-resistance hardware handcrafted in
  Rhode Island with a gamified software platform of interactive challenges
  (Endeavor, Meteor, Wavelength), live and on-demand races, scenic rows, coached
  classes, and custom workouts. Ergatta sells the Luxe and Lite rowers plus
  upgrade kits for existing WaterRower and Concept2 machines, delivered through a
  Shopify-hosted direct-to-consumer storefront with a membership subscription.
  Ergatta does not publish a public developer API; this API Evangelist profile
  captures its public web surface and identity for network discovery.
